<div class="drona-monitor">
  <div class="dm-card">
    <div class="dm-title"><span class="dm-dot"></span> Output / Error Logs
      <span class="dm-updated">· job {{JOBID}}</span>
    </div>
    <div class="dm-logterm">
      <input type="radio" id="dm-tab-out" name="dm-log-toggle" checked>
      <input type="radio" id="dm-tab-err" name="dm-log-toggle">
      <div class="dm-log-tabbar">
        <label for="dm-tab-out" class="dm-log-tab">Standard Output</label>
        <label for="dm-tab-err" class="dm-log-tab">Error Log</label>
      </div>
      <div class="dm-log-pane dm-log-out">
{{OUTPUT}}
      </div>
      <div class="dm-log-pane dm-log-err">
{{ERROR}}
      </div>
    </div>
  </div>
</div>
