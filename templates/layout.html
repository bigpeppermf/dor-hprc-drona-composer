    <style>
      /* ===== Mosaic design-system theme tokens (shared with the dashboard) =====
         Each theme defines the full --mosaic-color-* palette. The builder/app
         use a small set of aliases (below) that point at the mosaic tokens, so
         everything follows the active theme without per-theme duplication. */
      :root {
        /* App/builder aliases -> mosaic tokens (theme-independent indirection) */
        --app-bg: var(--mosaic-color-app-bg);
        --app-text: var(--mosaic-color-text-primary);
        --text-sub: var(--mosaic-color-text-muted);
        --surface: var(--mosaic-color-surface-bg);
        --surface-muted: var(--mosaic-color-surface-bg-hover);
        --surface-code: var(--mosaic-color-table-header-bg);
        --border: var(--mosaic-color-border);
        --navbar-bg: var(--mosaic-color-primary);
        --navbar-fg: var(--mosaic-color-primary-text);
        --accent: var(--mosaic-color-primary);
        --accent-fg: var(--mosaic-color-primary-text);
        --canvas-bg: var(--mosaic-color-app-bg);
        --canvas-grid: var(--mosaic-color-border);
      }

      :root,
      html[data-theme="light"] {
        --mosaic-color-app-bg: #f6f7f9;
        --mosaic-color-surface-bg: #ffffff;
        --mosaic-color-surface-bg-hover: #eef1f5;
        --mosaic-color-text-primary: #172033;
        --mosaic-color-text-secondary: #4b5565;
        --mosaic-color-text-muted: #6b7280;
        --mosaic-color-text-inverse: #ffffff;
        --mosaic-color-border: #d9dee7;
        --mosaic-color-border-strong: #b7c0cf;
        --mosaic-color-table-header-bg: #edf1f6;
        --mosaic-color-link: #003c71;
        --mosaic-color-primary: #500000;
        --mosaic-color-primary-hover: #6b1116;
        --mosaic-color-primary-text: #ffffff;
        --mosaic-color-selected-bg: rgba(80, 0, 0, 0.1);
        --mosaic-color-selected-text: #500000;
        --mosaic-color-icon: #536072;
        --mosaic-color-icon-active: #172033;
        --mosaic-color-warning-text: #500000;
        --mosaic-color-warning-text-soft: #b45309;
        --mosaic-color-success-text: #14733f;
        --mosaic-color-success-bg: #2f8f55;
        --mosaic-color-success-bg-hover: #267747;
        --mosaic-color-caution-text: #9a6700;
        --mosaic-color-caution-bg: #d99a12;
        --mosaic-color-danger-text: #b4232a;
        --mosaic-color-danger-bg: #c8373e;
        --mosaic-color-danger-bg-hover: #a9272e;
        --mosaic-color-alert-bg: #fef2f2;
        --mosaic-color-alert-border: #c8373e;
        --mosaic-color-alert-text: #8f171d;
        --mosaic-color-alert-text-secondary: #a9272e;
        --mosaic-color-tooltip-bg: #172033;
        --mosaic-color-tooltip-text: #ffffff;
        --mosaic-color-overlay: rgba(0, 0, 0, 0.5);
      }
      html[data-theme="dark"] {
        --mosaic-color-app-bg: #202020;
        --mosaic-color-surface-bg: #2a2a2a;
        --mosaic-color-surface-bg-hover: #333333;
        --mosaic-color-text-primary: #ffffff;
        --mosaic-color-text-secondary: #d1d1d1;
        --mosaic-color-text-muted: #a6a6a6;
        --mosaic-color-text-inverse: #111827;
        --mosaic-color-border: #3e3e3e;
        --mosaic-color-border-strong: #505050;
        --mosaic-color-table-header-bg: #242424;
        --mosaic-color-link: #f3a6a6;
        --mosaic-color-primary: #500000;
        --mosaic-color-primary-hover: #732f2f;
        --mosaic-color-primary-text: #ffffff;
        --mosaic-color-selected-bg: rgba(80, 0, 0, 0.42);
        --mosaic-color-selected-text: #ffffff;
        --mosaic-color-icon: #d1d1d1;
        --mosaic-color-icon-active: #ffffff;
        --mosaic-color-warning-text: #f3a6a6;
        --mosaic-color-warning-text-soft: #fca5a5;
        --mosaic-color-success-text: #86efac;
        --mosaic-color-success-bg: #3f7f33;
        --mosaic-color-success-bg-hover: #4d9d33;
        --mosaic-color-caution-text: #f3a316;
        --mosaic-color-caution-bg: #d99012;
        --mosaic-color-danger-text: #fca5a5;
        --mosaic-color-danger-bg: #a83232;
        --mosaic-color-danger-bg-hover: #c03a3a;
        --mosaic-color-alert-bg: rgba(127, 29, 29, 0.2);
        --mosaic-color-alert-border: #732f2f;
        --mosaic-color-alert-text: #fca5a5;
        --mosaic-color-alert-text-secondary: #f87171;
        --mosaic-color-tooltip-bg: #151515;
        --mosaic-color-tooltip-text: #ffffff;
        --mosaic-color-overlay: rgba(0, 0, 0, 0.5);
      }
      html[data-theme="lavender"] {
        --mosaic-color-app-bg: #15121d;
        --mosaic-color-surface-bg: #211c2b;
        --mosaic-color-surface-bg-hover: #2c2540;
        --mosaic-color-text-primary: #f5f3ff;
        --mosaic-color-text-secondary: #ddd6fe;
        --mosaic-color-text-muted: #b4abc8;
        --mosaic-color-text-inverse: #15121d;
        --mosaic-color-border: #3b3353;
        --mosaic-color-border-strong: #51466f;
        --mosaic-color-table-header-bg: #2a233b;
        --mosaic-color-link: #c4b5fd;
        --mosaic-color-primary: #c4b5fd;
        --mosaic-color-primary-hover: #a78bfa;
        --mosaic-color-primary-text: #15121d;
        --mosaic-color-selected-bg: rgba(167, 139, 250, 0.22);
        --mosaic-color-selected-text: #ddd6fe;
        --mosaic-color-icon: #d8d0ee;
        --mosaic-color-icon-active: #f5f3ff;
        --mosaic-color-warning-text: #fdba74;
        --mosaic-color-warning-text-soft: #fb923c;
        --mosaic-color-success-text: #bbf7d0;
        --mosaic-color-success-bg: #34d399;
        --mosaic-color-success-bg-hover: #10b981;
        --mosaic-color-caution-text: #fde68a;
        --mosaic-color-caution-bg: #f59e0b;
        --mosaic-color-danger-text: #fbcfe8;
        --mosaic-color-danger-bg: #ec4899;
        --mosaic-color-danger-bg-hover: #db2777;
        --mosaic-color-alert-bg: rgba(236, 72, 153, 0.14);
        --mosaic-color-alert-border: #f472b6;
        --mosaic-color-alert-text: #f9a8d4;
        --mosaic-color-alert-text-secondary: #f472b6;
        --mosaic-color-tooltip-bg: #0f0b16;
        --mosaic-color-tooltip-text: #f5f3ff;
        --mosaic-color-overlay: rgba(0, 0, 0, 0.5);
      }
      html[data-theme="pink"] {
        --mosaic-color-app-bg: #1a1423;
        --mosaic-color-surface-bg: #241a30;
        --mosaic-color-surface-bg-hover: #31213f;
        --mosaic-color-text-primary: #fdf2f8;
        --mosaic-color-text-secondary: #fbcfe8;
        --mosaic-color-text-muted: #d8b4c9;
        --mosaic-color-text-inverse: #1a1423;
        --mosaic-color-border: #4a334f;
        --mosaic-color-border-strong: #66435f;
        --mosaic-color-table-header-bg: #31213f;
        --mosaic-color-link: #f9a8d4;
        --mosaic-color-primary: #f9a8d4;
        --mosaic-color-primary-hover: #f472b6;
        --mosaic-color-primary-text: #1a1423;
        --mosaic-color-selected-bg: rgba(244, 114, 182, 0.2);
        --mosaic-color-selected-text: #fbcfe8;
        --mosaic-color-icon: #fbcfe8;
        --mosaic-color-icon-active: #fdf2f8;
        --mosaic-color-warning-text: #f9a8d4;
        --mosaic-color-warning-text-soft: #f9a8d4;
        --mosaic-color-success-text: #bbf7d0;
        --mosaic-color-success-bg: #34d399;
        --mosaic-color-success-bg-hover: #10b981;
        --mosaic-color-caution-text: #fce7f3;
        --mosaic-color-caution-bg: #f9a8d4;
        --mosaic-color-danger-text: #fbcfe8;
        --mosaic-color-danger-bg: #db2777;
        --mosaic-color-danger-bg-hover: #be185d;
        --mosaic-color-alert-bg: rgba(190, 24, 93, 0.16);
        --mosaic-color-alert-border: #ec4899;
        --mosaic-color-alert-text: #f9a8d4;
        --mosaic-color-alert-text-secondary: #f472b6;
        --mosaic-color-tooltip-bg: #140f1c;
        --mosaic-color-tooltip-text: #fdf2f8;
        --mosaic-color-overlay: rgba(0, 0, 0, 0.5);
      }

      /* Disable manual typing in the Drona working directory picker and hides the text typing area */
      .drona-dir-picker input[type="text"] {
        display: none !important;
      }

      /* ---- Top navbar ---- */
      body {
        margin: 0;
        background-color: var(--app-bg);
        color: var(--app-text);
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .app-topnav {
        display: flex;
        align-items: stretch;
        background-color: var(--navbar-bg);
        color: var(--navbar-fg);
        font-family: "Open Sans", sans-serif;
        height: 64px;
        padding: 0 0.5rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      /* Brand doubles as a "home" button and fills the bar height */
      .topnav-brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        height: 100%;
        padding: 0 1.25rem;
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--navbar-fg);
        text-decoration: none;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .topnav-brand:hover,
      .topnav-brand:focus {
        background: color-mix(in srgb, var(--navbar-fg) 12%, transparent);
        color: var(--navbar-fg);
        text-decoration: none;
      }
      .topnav-brand .topnav-cluster {
        font-weight: 400;
        font-size: 0.8rem;
        letter-spacing: 0;
        text-transform: none;
        opacity: 0.7;
      }
      /* Tab links — same ideology as the old sidebar tabs */
      .topnav-tabs {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: 1.25rem;
        padding-left: 1.25rem;
        border-left: 1px solid color-mix(in srgb, var(--navbar-fg) 18%, transparent);
      }
      .topnav-link {
        display: flex;
        align-items: center;
        padding: 0.45rem 1rem;
        color: var(--navbar-fg);
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.95rem;
        opacity: 0.85;
        transition: background 0.15s ease, opacity 0.15s ease;
      }
      .topnav-link:hover {
        background: color-mix(in srgb, var(--navbar-fg) 14%, transparent);
        color: var(--navbar-fg);
        text-decoration: none;
        opacity: 1;
      }
      .topnav-link.active {
        background: color-mix(in srgb, var(--navbar-fg) 22%, transparent);
        font-weight: 700;
        opacity: 1;
      }
      /* Logo pinned to the right */
      .topnav-logo {
        margin-left: auto;
        display: flex;
        align-items: center;
        padding: 0 0.75rem;
      }
      .topnav-logo img {
        display: block;
        height: 38px;
        width: auto;
      }
      /* ---- Theme switcher (dropdown) ---- */
      .topnav-theme {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin-left: auto;
        padding: 0 0.6rem;
      }
      .topnav-theme + .topnav-logo {
        margin-left: 0;
      }
      .topnav-theme-label {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.75;
      }
      .theme-select {
        background: color-mix(in srgb, var(--navbar-fg) 12%, transparent);
        color: var(--navbar-fg);
        border: 1px solid color-mix(in srgb, var(--navbar-fg) 30%, transparent);
        border-radius: 6px;
        padding: 0.32rem 0.55rem;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .theme-select:hover {
        background: color-mix(in srgb, var(--navbar-fg) 20%, transparent);
      }
      .theme-select:focus {
        outline: none;
        border-color: color-mix(in srgb, var(--navbar-fg) 60%, transparent);
      }
      /* Native dropdown list items render on the surface color — keep readable. */
      .theme-select option {
        color: var(--mosaic-color-text-primary);
        background: var(--mosaic-color-surface-bg);
      }

      /* ===== Theme-aware Composer chrome =====
         Written with the theme vars so it applies in every theme (in light the
         vars resolve to the original colors, so nothing changes there). Inline
         styles on individual components still win — those are a later sweep. */
      #main-container {
        color: var(--app-text);
      }
      #main-container .card {
        background: var(--surface);
        color: var(--app-text);
        border-color: var(--border);
      }
      #main-container .form-control,
      #main-container select,
      #main-container textarea,
      #main-container input[type="text"],
      #main-container input[type="number"],
      #main-container input[type="search"] {
        background: var(--surface);
        color: var(--app-text);
        border-color: var(--border);
      }
      #main-container .form-control::placeholder {
        color: var(--text-sub);
      }
      #main-container .input-group-text {
        background: var(--surface-muted);
        color: var(--text-sub);
        border-color: var(--border);
      }
      #main-container label,
      #main-container h1,
      #main-container h2,
      #main-container h3,
      #main-container h4,
      #main-container h5 {
        color: var(--app-text);
      }
      #main-container .text-muted,
      #main-container small {
        color: var(--text-sub) !important;
      }
      #main-container .table {
        color: var(--app-text);
      }
      #main-container .table td,
      #main-container .table th {
        border-color: var(--border);
      }
      /* Modals + dropdowns render at the body level, so theme them globally. */
      .modal-content,
      .dropdown-menu {
        background: var(--surface);
        color: var(--app-text);
        border-color: var(--border);
      }
      .modal-header,
      .modal-footer {
        border-color: var(--border);
      }
      .dropdown-item {
        color: var(--app-text);
      }
      .dropdown-item:hover {
        background: var(--surface-muted);
        color: var(--app-text);
      }
      /* Code preview (CodeMirror) keeps its own light theme in light mode;
         soften the surround so it doesn't glare on dark backdrops. */
      html[data-theme="maroon"] .CodeMirror,
      html[data-theme="dark"] .CodeMirror {
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      /* Bootstrap white/light utility classes used inside the form (drag-drop
         containers, cards) — only remap on the dark themes. */
      html[data-theme="maroon"] #main-container .bg-white,
      html[data-theme="dark"] #main-container .bg-white,
      html[data-theme="maroon"] #main-container .bg-light,
      html[data-theme="dark"] #main-container .bg-light {
        background-color: var(--surface) !important;
        color: var(--app-text);
      }
      html[data-theme="maroon"] #main-container .border,
      html[data-theme="dark"] #main-container .border {
        border-color: var(--border) !important;
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var VALID = ["light", "dark", "lavender", "pink"];
        var t = "light";
        try {
          var saved = localStorage.getItem("drona-theme");
          if (VALID.indexOf(saved) !== -1) t = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <script>
         window.APP_ROOT = {{ request.script_root|tojson }};
         document.dashboard_url = window.APP_ROOT;

         document.file_app_url = "{{ config.file_app_url }}";
         document.file_editor_url = "{{ config.file_editor_url }}";
         document.user = "{{ config.user }}";
         document.drona_dir = {{ config.drona_dir|tojson }}

      window.CONFIG_STATUS_URL = "{{ url_for('job_composer.config_status') }}";
      window.CONFIG_SAVE_URL = "{{ url_for('job_composer.config_save') }}";
    </script>

    <header class="app-topnav">
      <a class="topnav-brand" href="{{ url_for('index') }}">
        Drona Workflow Engine
        <span class="topnav-cluster">{{ config.cluster_name }}</span>
      </a>
      <nav class="topnav-tabs">
        <a
          class="topnav-link {{ 'active' if request.endpoint == 'index' }}"
          href="{{ url_for('index') }}"
          >Composer</a
        >
        <a
          class="topnav-link {{ 'active' if request.endpoint == 'builder' }}"
          href="{{ url_for('builder') }}"
          >Environment Builder</a
        >
      </nav>
      <div class="topnav-theme">
        <label class="topnav-theme-label" for="theme-select">Theme</label>
        <select id="theme-select" class="theme-select" aria-label="Theme">
          <option value="light">☀ Light</option>
          <option value="dark">☾ Dark</option>
          <option value="lavender">❖ Dark Lavender</option>
          <option value="pink">❀ Dark Pink</option>
        </select>
      </div>
      <a class="topnav-logo" href="{{ url_for('index') }}">
        <img
          src="{{ url_for('static', filename='images/HPRC-Identity-ExternalLeft-Dark.svg') }}"
          alt="HPRC"
        />
      </a>
    </header>
    <script>
      // Theme switcher: persist choice + broadcast so JS apps (the builder) can react.
      (function () {
        var sel = document.getElementById("theme-select");
        function apply(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          try {
            localStorage.setItem("drona-theme", theme);
          } catch (e) {}
          if (sel && sel.value !== theme) sel.value = theme;
          window.dispatchEvent(
            new CustomEvent("drona-theme-change", { detail: { theme: theme } })
          );
        }
        var current = document.documentElement.getAttribute("data-theme") || "light";
        apply(current);
        if (sel) {
          sel.addEventListener("change", function () {
            apply(sel.value);
          });
        }
      })();
    </script>

    <main id="main-container" class="{% block main_class %}container{% endblock %}" role="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-2"></footer>

    {% block app_bundles %}
    <script src="{{url_for('static', filename='dist/vendors.bundle.js')}}"></script>
    <script src="{{url_for('static', filename='dist/react.bundle.js')}}"></script>
    <script src="{{url_for('static', filename='dist/main.bundle.js')}}"></script>
    {% endblock %}
    <script src="{{ url_for('static', filename='jquery-3.4.1/jquery-3.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap-4.4.1/js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='DataTables/datatables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='jquery-ui-1.12.1/jquery-ui.min.js') }}"></script>
    <script src="{{ url_for('static', filename='chartjs-2.9.3/Chart.bundle.min.js') }}"></script>
    <!-- <script src="{{ url_for('static', filename='custom/js/job_composer.js') }}"></script> -->
  </body>
</html>
